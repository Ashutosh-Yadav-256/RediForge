name: Release RediForge Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build-args: --win nsis --publish never
            artifact: desktop/release/*.exe
          - os: macos-latest
            platform: mac
            build-args: --mac dmg zip --publish never
            artifact: desktop/release/*.dmg
          - os: ubuntu-latest
            platform: linux
            build-args: --linux AppImage --publish never
            artifact: desktop/release/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Test Suite
        working-directory: desktop
        run: npm test

      - name: Build Application Bundle
        working-directory: desktop
        run: npm run build

      - name: Package Desktop Installer (${{ matrix.platform }})
        working-directory: desktop
        run: npx electron-builder ${{ matrix.build-args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RediForge Desktop ${{ github.ref_name }}
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
