name: Release RediForge Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build-args: --win nsis --publish never
            artifact-pattern: desktop/release/*.exe
            artifact-name: windows-installer
          - os: macos-latest
            platform: mac
            build-args: --mac dmg --publish never
            artifact-pattern: desktop/release/*.dmg
            artifact-name: macos-installer
          - os: ubuntu-latest
            platform: linux
            build-args: --linux AppImage --publish never
            artifact-pattern: desktop/release/*.AppImage
            artifact-name: linux-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Test Suite
        working-directory: desktop
        run: npm test

      - name: Build Application Bundle
        working-directory: desktop
        run: npm run build

      - name: Package Desktop Installer (${{ matrix.platform }})
        working-directory: desktop
        run: npx electron-builder ${{ matrix.build-args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RediForge Desktop ${{ github.event.inputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
